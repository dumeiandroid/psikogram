<script>
// =========================================================
// KONFIGURASI API
// =========================================================
const CONFIG = {
    API_URL    : 'https://lidan-co-id.pages.dev/api/contacts_filter_dinamis6',
    TABLE_NAME : 'nilai1_json',
    API_SECRET : 'admin'
};

function getParamsFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return {
        id_x : params.get('id_x'),
        x_01 : params.get('x_01')
    };
}

async function fetchData(id, x_01) {
    const url = `${CONFIG.API_URL}?table=${CONFIG.TABLE_NAME}&id_x=${id}`;
    const res = await fetch(url, {
        headers: {
            'X-Custom-Auth': CONFIG.API_SECRET,
            'Content-Type': 'application/json'
        }
    });
    if (!res.ok) throw new Error(`HTTP error ${res.status}`);
    const json = await res.json();
    if (!json.success) throw new Error(json.message || 'Data tidak ditemukan');

    const data = json.data;
    const firstData = Array.isArray(data) ? data[0] : data;
    const x01Data = firstData?.x_01;
    if (String(x01Data) !== String(x_01)) {
        throw new Error('Akses ditolak: parameter x_01 tidak valid.');
    }
    return firstData;
}

// =========================================================
// PARSE x_05
// =========================================================
function parseX05(x05) {
    try {
        const parsed = JSON.parse(x05);
        return {
            cfit1: parsed.cfit1 || 0,
            cfit2: parsed.cfit2 || 0,
            cfit3: parsed.cfit3 || 0,
            cfit4: parsed.cfit4 || 0,
            tkd3: parsed.tkd3 || 0,
            tkd6: parsed.tkd6 || 0,
            raw: parsed
        };
    } catch(e) {
        const parts = x05.split('|').map(v => parseInt(v) || 0);
        return {
            cfit1: parts[0] || 0,
            cfit2: parts[1] || 0,
            cfit3: parts[2] || 0,
            cfit4: parts[3] || 0,
            tkd3: parts[15] || 0,
            tkd6: parts[17] || 0,
            raw: parts
        };
    }
}

// =========================================================
// FUNGSI UTAMA
// =========================================================
function hitungPsikogram(data) {
    const x02 = data.x_02 || '';
    const partsX02 = x02.split('|');
    const firstPart = partsX02[0] ? partsX02[0].split(';') : [];
    
    const x05 = data.x_05 || '{}';
    const parsedX05 = parseX05(x05);
    
    const CFIT1 = parsedX05.cfit1;
    const CFIT2 = parsedX05.cfit2;
    const CFIT3 = parsedX05.cfit3;
    const CFIT4 = parsedX05.cfit4;
    const tkd3 = parsedX05.tkd3;
    const tkd6 = parsedX05.tkd6;
    const skorCFIT = CFIT1 + CFIT2 + CFIT3 + CFIT4;
    
    const x06 = data.x_06 || '';
    const partsX06 = x06.split('|').map(v => v.trim());
    
    const x10 = data.x_10 || '';
    const partsX10 = x10.split('|').map(v => v.split(';').map(s => s.trim()));

    const identitas = {
        nama: firstPart[0] || '',
        jk: firstPart[8] || '',
        usia: firstPart[4] || '',
        tanggal: (partsX10[0] && partsX10[0][1]) || '',
        tanggalTTD: (partsX10[0] && partsX10[0][4]) || ''
    };

    const usia = parseFloat(identitas.usia) || 25;
    let IQ = 80 + (skorCFIT * 0.8);
    if (IQ > 140) IQ = 140;
    if (IQ < 40) IQ = 40;
    IQ = Math.round(IQ);
    
    if (partsX10[0] && partsX10[0][3] && parseInt(partsX10[0][3]) !== 0) {
        IQ = parseInt(partsX10[0][3]);
    }

    const eppsStr = partsX06[0] || '';
    const eppsSoal = eppsStr.split(';').map(v => v.trim());
    
    let ACH = 10, DEF = 8, ORD = 12, EXH = 6, AUT = 4, AFF = 9;
    let DOM = 8, konsistensi = 13;
    
    if (eppsSoal.length >= 225) {
        const countA = eppsSoal.filter(v => v === 'A').length;
        const countB = eppsSoal.filter(v => v === 'B').length;
        ACH = Math.round((countA / 225) * 15) + 3;
        DEF = Math.round((countB / 225) * 12) + 2;
        ORD = Math.round((countA / 225) * 14) + 4;
        EXH = Math.round((countB / 225) * 10) + 1;
        AUT = Math.round((countA / 225) * 8) + 1;
        AFF = Math.round((countB / 225) * 11) + 3;
        DOM = Math.round((countA / 225) * 10) + 2;
        konsistensi = Math.round((countA + countB) / 225 * 14) + 1;
        if (konsistensi > 15) konsistensi = 15;
    }

    function getSkala(value, type) {
        if (type === 'iq') {
            if (value <= 60) return 1;
            if (value <= 69) return 2;
            if (value <= 79) return 3;
            if (value <= 89) return 4;
            if (value <= 99) return 5;
            if (value <= 109) return 6;
            if (value <= 119) return 7;
            if (value <= 129) return 8;
            if (value <= 139) return 9;
            return 10;
        }
        if (type === 'cfit') {
            if (value <= 2) return 1;
            if (value <= 3) return 2;
            if (value <= 4) return 3;
            if (value <= 5) return 4;
            if (value <= 7) return 5;
            if (value <= 8) return 6;
            if (value <= 9) return 7;
            if (value <= 10) return 8;
            if (value <= 11) return 9;
            return 10;
        }
        if (type === 'tkd3') {
            if (value <= 12) return 1;
            if (value <= 16) return 2;
            if (value <= 20) return 3;
            if (value <= 23) return 4;
            if (value <= 27) return 5;
            if (value <= 31) return 6;
            if (value <= 35) return 7;
            if (value <= 38) return 8;
            if (value <= 40) return 9;
            return 10;
        }
        if (type === 'tkd6') {
            if (value <= 2) return 1;
            if (value <= 5) return 2;
            if (value <= 9) return 3;
            if (value <= 12) return 4;
            if (value <= 16) return 5;
            if (value <= 19) return 6;
            if (value <= 23) return 7;
            if (value <= 26) return 8;
            if (value <= 30) return 9;
            return 10;
        }
        if (value <= 2) return 1;
        if (value <= 4) return 2;
        if (value <= 6) return 3;
        if (value <= 8) return 4;
        if (value <= 10) return 5;
        if (value <= 12) return 6;
        if (value <= 14) return 7;
        if (value <= 16) return 8;
        if (value <= 18) return 9;
        return 10;
    }

    const avgDOMACH = (DOM + ACH + AUT) / 3;

    let resultScores = [
        getSkala(IQ, 'iq'),
        getSkala(CFIT2, 'cfit'),
        getSkala((CFIT1 + CFIT4) / 2, 'cfit'),
        getSkala(CFIT3, 'cfit'),
        getSkala(tkd3, 'tkd3'),
        getSkala(tkd6, 'tkd6'),
        getSkala(ACH, 'ach'),
        getSkala(avgDOMACH, 'ach'),
        getSkala(EXH, 'ach'),
        getSkala(AFF, 'ach'),
        getSkala(DEF, 'ach'),
        getSkala(ORD, 'ach'),
        getSkala(avgDOMACH, 'ach'),
        getSkala(AUT, 'ach')
    ];

    if (partsX10[1]) {
        for (let i = 0; i <= 13; i++) {
            const val = parseInt(partsX10[1][i]);
            if (!isNaN(val) && val !== 0) {
                resultScores[i] = val;
            }
        }
    }

    // =========================================================
    // TEKS STATIS UNTUK KELEBIHAN, KELEMAHAN, REKOMENDASI
    // =========================================================
    const teksKelebihan = [
        'Mampu menemukan solusi untuk berbagai masalah dengan efektif.',
        'Memiliki kepekaan tinggi dalam membaca informasi visual secara cepat dan akurat.',
        'Menunjukkan kemampuan yang baik dalam menyusun argumen yang runtut dan terstruktur.',
        'Unggul dalam memahami konsep-konsep yang bersifat non-literal dan penuh makna tersirat.',
        'Mampu berkomunikasi dengan jelas dan efektif dalam interaksi.',
        'Kemampuan memahami proses hitung dan berpikir teratur.',
        'Memiliki motivasi yang kuat untuk terus berkembang dan mencapai hasil terbaik.',
        'Mampu tetap tenang dan produktif meskipun berada dalam situasi yang penuh tekanan.',
        'Menampilkan sikap yang percaya diri dalam menyampaikan pendapat dan mengambil tindakan.',
        'Memiliki kemampuan interpersonal yang baik dalam membangun kedekatan dan kepercayaan.',
        'Dikenal sebagai rekan kerja yang dapat diandalkan dan mendukung keberhasilan tim.',
        'Dikenal teliti dalam merancang alur kerja yang jelas dan dapat diikuti secara konsisten.',
        'Proaktif dalam melihat peluang dan segera bertindak untuk memanfaatkannya.',
        'Mampu menyelesaikan pekerjaan secara mandiri tanpa harus bergantung pada arahan terus-menerus.'
    ];

    const teksKelemahan = [
        'Kesulitan menghadapi masalah yang sangat kompleks.',
        'Kurang perhatian terhadap detail yang lebih kecil, yang mempengaruhi hasil akhir.',
        'Kesulitan membuat keputusan cepat dalam situasi mendesak.',
        'Tantangan dalam menerjemahkan ide-ide abstrak ke dalam praktik.',
        'Kurang sabar dalam mendengarkan pandangan orang lain, yang menghambat komunikasi.',
        'Memerlukan waktu lebih lama untuk memahami konsep matematika yang lebih rumit.',
        'Beban ekspektasi tinggi dapat memengaruhi fokus dan kinerja.',
        'Kewalahan saat menghadapi tekanan yang berkepanjangan.',
        'Kurang terbuka terhadap kritik konstruktif, yang menghambat perkembangan.',
        'Canggung dalam situasi sosial baru, yang menghambat interaksi.',
        'Kesulitan beradaptasi dengan dinamika kelompok yang berbeda.',
        'Terlalu fokus pada perencanaan, sehingga mengabaikan implementasi.',
        'Pengambilan keputusan yang terburu-buru berisiko tinggi.',
        'Kesulitan dalam berkolaborasi dengan tim, yang dapat memengaruhi hasil kerja.'
    ];

    const teksRekomendasi = [
        'Disarankan untuk melatih kemampuan pemecahan masalah dengan mengikuti simulasi kasus kompleks dan berpartisipasi dalam diskusi kelompok.',
        'Penting untuk mengalokasikan waktu khusus untuk review hasil pekerjaan sebelum diselesaikan, guna memastikan tidak ada detail penting yang terlewat.',
        'Sebaiknya mengikuti pelatihan khusus yang dirancang untuk pengambilan keputusan di bawah tekanan.',
        'Disarankan untuk melakukan proyek kecil yang akan membantu menerapkan ide-ide abstrak ke dalam praktik nyata.',
        'Sangat bermanfaat untuk melatih keterampilan mendengarkan aktif melalui kegiatan role-playing.',
        'Disarankan untuk berlatih secara rutin dengan soal-soal matematika yang lebih kompleks.',
        'Sangat penting untuk menetapkan tujuan yang realistis dan melakukan evaluasi berkala.',
        'Sebaiknya mempraktikkan teknik relaksasi dan manajemen waktu yang efektif.',
        'Disarankan untuk secara rutin meminta umpan balik dari orang lain.',
        'Sangat dianjurkan untuk bergabung dengan kelompok sosial atau komunitas yang diminati.',
        'Disarankan untuk terlibat dalam berbagai aktivitas kelompok yang memerlukan kolaborasi.',
        'Sebaiknya tentukan batas waktu untuk setiap fase implementasi.',
        'Disarankan untuk selalu mempertimbangkan pro dan kontra secara mendalam sebelum mengambil keputusan.',
        'Sangat penting untuk terlibat dalam proyek kolaboratif yang dapat membantu meningkatkan keterampilan kerja sama.'
    ];

    const aspekNama = [
        'Kemampuan Umum', 'Daya Tangkap Visual', 'Berpikir Logis',
        'Berpikir Abstrak', 'Penalaran Verbal', 'Penalaran Numerik',
        'Hasrat Berprestasi', 'Daya Tahan Stress', 'Kepercayaan Diri',
        'Relasi Sosial', 'Kerjasama', 'Sistematika Kerja',
        'Inisiatif', 'Kemandirian'
    ];

    const indexed = resultScores.map((v, i) => ({ value: v, index: i, nama: aspekNama[i] }));
    const sorted_desc = [...indexed].sort((a, b) => b.value - a.value);
    const sorted_asc = [...indexed].sort((a, b) => a.value - b.value);

    const top3 = sorted_desc.slice(0, 3);
    const bottom3 = sorted_asc.slice(0, 3);

    const kelebihan = top3.map(item => teksKelebihan[item.index]);
    const kelemahan = bottom3.map(item => teksKelemahan[item.index]);
    const rekomendasi = bottom3.map(item => teksRekomendasi[item.index]);

    // =========================================================
    // MINAT
    // =========================================================
    const minatData = [
        { singkatan: 'MUS', nama: 'MUSICAL', ket: 'Minat di bidang seni musik dan pertunjukan. Cocok untuk jurusan: Seni Musik, Pendidikan Musik, Seni Pertunjukan.' },
        { singkatan: 'CLER', nama: 'CLERICAL', ket: 'Minat di bidang administrasi dan pengelolaan dokumen. Cocok untuk jurusan: Administrasi Perkantoran, Manajemen, Administrasi Bisnis.' },
        { singkatan: 'LITE', nama: 'LITERATURE', ket: 'Minat di bidang bahasa, sastra, dan penulisan. Cocok untuk jurusan: Sastra, Pendidikan Bahasa, Ilmu Komunikasi.' },
        { singkatan: 'OUT', nama: 'OUTDOOR', ket: 'Minat di bidang alam terbuka dan lingkungan. Cocok untuk jurusan: Kehutanan, Agroteknologi, Ilmu Kelautan.' },
        { singkatan: 'MECH', nama: 'MECHANICAL', ket: 'Minat di bidang mesin dan teknologi. Cocok untuk jurusan: Teknik Mesin, Teknik Industri, Teknik Elektro.' },
        { singkatan: 'COMP', nama: 'COMPUTATIONAL', ket: 'Minat di bidang hitungan dan analisis data. Cocok untuk jurusan: Akuntansi, Statistika, Matematika.' },
        { singkatan: 'PERS', nama: 'PERSUASIVE', ket: 'Minat di bidang komunikasi dan kepemimpinan. Cocok untuk jurusan: Manajemen, Ilmu Komunikasi, Hubungan Internasional.' },
        { singkatan: 'AESTH', nama: 'AESTHETIC', ket: 'Minat di bidang seni rupa dan desain. Cocok untuk jurusan: Desain Komunikasi Visual, Desain Interior, Seni Rupa.' },
        { singkatan: 'ACIE', nama: 'SCIENTIFIC', ket: 'Minat di bidang ilmu pengetahuan dan penelitian. Cocok untuk jurusan: Biologi, Kimia, Fisika, Farmasi.' },
